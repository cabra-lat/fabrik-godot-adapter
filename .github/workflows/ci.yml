name: adapter CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      # Written as an explicit include list rather than os x variant x compiler.
      # The cross product would be 18 jobs, most of them either impossible
      # (clang on the Windows image) or redundant (four godot-cpp variants of
      # the same platform). Every entry below is a combination we actually
      # want to claim, and nothing is built by accident.
      matrix:
        include:
          # Baseline: the three platforms, both variants.
          - id: linux-x64-debug-gcc
            os: ubuntu-latest
            variant: template_debug
            cxx: g++
          - id: linux-x64-release-gcc
            os: ubuntu-latest
            variant: template_release
            cxx: g++
          - id: macos-debug-gcc
            os: macos-latest
            variant: template_debug
            cxx: g++
          - id: macos-release-gcc
            os: macos-latest
            variant: template_release
            cxx: g++
          - id: windows-debug-gcc
            os: windows-latest
            variant: template_debug
            cxx: g++
          - id: windows-release-gcc
            os: windows-latest
            variant: template_release
            cxx: g++
          # aarch64. Free on a public repo, and a 64-bit Fortran runtime with a
          # different alignment and vector story is exactly the thing a
          # three-x86_64 matrix would never notice.
          - id: linux-arm64-release-gcc
            os: ubuntu-24.04-arm
            variant: template_release
            cxx: g++
          # clang beside gcc. Different codegen means an aliasing or
          # strict-aliasing mistake at the Fortran C ABI boundary surfaces here
          # and essentially nowhere else.
          - id: linux-x64-release-clang
            os: ubuntu-latest
            variant: template_release
            cxx: clang++
          - id: macos-debug-clang
            os: macos-latest
            variant: template_debug
            cxx: clang++
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.id }}
    env:
      FABRIK_CORE_REPOSITORY: cabra-lat/fabrik-fortran
      # The checkout step below reads this rather than repeating the sha: two
      # copies of a ref is exactly how the adapter ends up compiling against a
      # core that predates the entry points it calls.
      FABRIK_CORE_REF: 16b3a7f8074eac5cbbd0eb7a3ad9d749a692369d
      # godot-cpp 4.4-stable ships no CMake install/export rules, so there is no
      # find_package() target to cache. ccache is the cache that works with the
      # add_subdirectory() flow, and the key is pinned to the godot-cpp commit.
      GODOT_CPP_REPOSITORY: godotengine/godot-cpp
      GODOT_CPP_REF: 714c9e2c165db2dcb7e6ea57e62a04204d3cfbfa
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 2G
    steps:
      - uses: actions/checkout@v4
      - name: Check out standalone core
        uses: actions/checkout@v4
        with:
          repository: cabra-lat/fabrik-fortran
          ref: ${{ env.FABRIK_CORE_REF }}
          path: core
      - uses: fortran-lang/setup-fortran@v1
        with:
          compiler: gcc
          version: ${{ runner.os == 'macOS' && '12' || 'latest' }}
      - uses: fortran-lang/setup-fpm@v10
        with:
          fpm-version: "v0.13.0"
      - name: Build and test core
        working-directory: core
        run: |
          fpm test --profile release
          fpm build --profile release
      - name: Assemble core install prefix
        shell: bash
        run: |
          # `python` is not a guaranteed name on every image (and is a
          # Windows Store alias on some), so resolve it instead of assuming.
          py=python3
          command -v python3 >/dev/null 2>&1 || py=python
          command -v "$py" >/dev/null 2>&1 || { echo "no python on $RUNNER_OS"; exit 1; }
          "$py" ci/collect_fpm_prefix.py --build core/build --prefix core-prefix
      - name: Check out pinned godot-cpp
        uses: actions/checkout@v4
        with:
          repository: godotengine/godot-cpp
          ref: 714c9e2c165db2dcb7e6ea57e62a04204d3cfbfa
          path: godot-cpp
      - name: Install ccache
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            choco install ccache -y --no-progress
            echo "/c/ProgramData/chocolatey/bin" >> "$GITHUB_PATH"
          elif [ "$RUNNER_OS" = "macOS" ]; then
            brew install ccache
          else
            sudo apt-get update
            sudo apt-get install -y ccache
          fi
      - name: Restore godot-cpp build cache
        id: ccache-restore
        uses: actions/cache/restore@v6
        with:
          path: .ccache
          key: ccache-${{ matrix.id }}-${{ env.GODOT_CPP_REF }}
      - name: Configure adapter
        shell: bash
        run: >
          cmake -S . -B build -G Ninja
          -DFABRIK_CORE_ROOT=core-prefix
          -DGODOT_CPP_SOURCE_DIR=godot-cpp
          -DFABRIK_GODOT_CPP_VARIANT=${{ matrix.variant }}
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build adapter and C ABI smoke test
        shell: bash
        run: |
          # Name the targets explicitly. `cmake --build build` with no target
          # would also build the godot-cpp variants nothing links against.
          cmake --build build --parallel 2 --target fabrik_adapter fabrik_cxx_smoke
          ctest --test-dir build --output-on-failure
      - name: Godot runtime check (4.4.1, 4.5.1, 4.6.1, 4.7.1)
        shell: bash
        run: |
          set -euo pipefail
          echo "runner: $RUNNER_OS ${{ matrix.variant }} ${{ matrix.cxx }}"
          # Library name only. The engine URLs are built in the version loop
          # from one table, so adding a Godot version costs one line instead of
          # four per platform, and an architecture change cannot leave an x86_64
          # asset in place of the arm64 one.
          case "$RUNNER_OS" in
            Linux)
              ext="so"
              lib="libfabrik_adapter.so"
              ;;
            macOS)
              ext="dylib"
              lib="libfabrik_adapter.dylib"
              ;;
            Windows)
              ext="dll"
              lib="fabrik_adapter.dll"
              ;;
          esac
          # An arm64 runner must not be handed the x86_64 engine: it either fails
          # to execute or, under a permissive loader, produces a green run that
          # says nothing about the machine it claims to have tested.
          if [ "$RUNNER_OS" = "Linux" ] && [ "${RUNNER_ARCH:-}" = "ARM64" ]; then
            linux_plat="linux.arm64"
          else
            linux_plat="linux.x86_64"
          fi
          echo "linux engine asset: $linux_plat (RUNNER_ARCH=${RUNNER_ARCH:-unset})"
          # Do not duplicate the build-system's output path here: locate the
          # library wherever CMake put it, and print the truth before failing so
          # a wrong assumption is never mistaken for a missing build.
          echo "--- build/bin:"
          ls -l build/bin 2>&1 || true
          src="$(find build -name "$lib" -type f | head -1)"
          if [ -z "$src" ]; then
            # Toolchains differ on the shared-library prefix; fall back to a
            # pattern so a naming difference is not reported as a missing build.
            src="$(find build -name "*fabrik_adapter*.$ext" -type f | head -1)"
          fi
          if [ -z "$src" ]; then
            echo "could not find $lib under build/; candidates:"
            find build -name "*.dll" -o -name "*.so" -o -name "*.dylib" | head -20
            exit 1
          fi
          echo "using $src"
          if [ "$RUNNER_OS" = "Windows" ]; then
            # A MinGW build imports libgfortran-5.dll, and -static-libgfortran is
            # best-effort: it does nothing on a toolchain that ships no
            # libgfortran.a. Ship the runtime next to the extension instead, and
            # ask the compiler where its own runtime lives rather than guessing a
            # path. The import table printed above is the source of truth for
            # which of these are actually needed.
            for rt in libgfortran-5.dll libgcc_s_seh-1.dll libstdc++-6.dll libwinpthread-1.dll libquadmath-0.dll; do
              origin="$(gfortran -print-file-name=$rt 2>/dev/null || true)"
              if [ -f "$origin" ]; then
                echo "  runtime $rt <- $origin"
                cp "$origin" "demo/bin/$rt"
              else
                echo "  runtime $rt: not provided by this toolchain (skipped)"
              fi
            done
          fi
          # Print what the library imports. A Windows "Error 126" is otherwise
          # silent about the DLL that is missing, and that is the whole diagnosis.
          if command -v objdump >/dev/null 2>&1; then
            echo "--- imports of $lib:"
            objdump -p "$src" 2>/dev/null | grep -i "DLL Name" || echo "(no import table readable)"
          else
            echo "objdump unavailable; cannot show the import table"
          fi
          mkdir -p demo/bin
          cp "$src" "demo/bin/$lib"
          ls -l demo/bin
          # Windows does not reliably search the GDExtension's own directory for
          # its transitive DLL dependencies. Put the complete runtime bundle on
          # the child process PATH before launching Godot. This also covers
          # dependencies such as libquadmath which are not listed in the
          # adapter's direct import table.
          if [ "$RUNNER_OS" = "Windows" ]; then
            export PATH="$PWD/demo/bin:$PATH"
            echo "Windows runtime PATH: $PATH"
            objdump -p demo/bin/libgfortran-5.dll 2>/dev/null | grep -i "DLL Name" || true
          fi
          # GNU timeout does not exist on macOS runners, so install coreutils for
          # gtimeout and keep the hang guard active everywhere. If neither binary
          # is available, run unguarded and say so out loud - a silently missing
          # guard is what makes a hanging job look like a slow job.
          if command -v timeout >/dev/null 2>&1; then
            guard="timeout"
          elif command -v gtimeout >/dev/null 2>&1; then
            guard="gtimeout"
          else
            if command -v brew >/dev/null 2>&1; then brew install coreutils; fi
            if command -v gtimeout >/dev/null 2>&1; then
              guard="gtimeout"
            else
              guard=""
            fi
          fi
          echo "hang guard: ${guard:-DISABLED (no timeout binary on this runner)}"
          # An empty "$guard 300 ..." does not drop the argument - it runs a
          # command literally named "300". Use a function instead.
          run_guarded() {
            if [ -n "$guard" ]; then
              "$guard" 300 "$@"
            else
              "$@"
            fi
          }
          for version in 4.4.1 4.5.1 4.6.1 4.7.1; do
            base="https://github.com/godotengine/godot/releases/download/${version}-stable/Godot_v${version}-stable"
            case "$RUNNER_OS" in
              Linux)
                url="${base}_${linux_plat}.zip"
                bin_name="Godot_v${version}-stable_${linux_plat}"
                ;;
              macOS)
                url="${base}_macos.universal.zip"
                bin_name="Godot.app/Contents/MacOS/Godot"
                ;;
              Windows)
                url="${base}_win64.exe.zip"
                bin_name="Godot_v${version}-stable_win64.exe"
                ;;
            esac
            godot_dir="$RUNNER_TEMP/godot_${version}"
            rm -rf "$godot_dir"
            mkdir -p "$godot_dir"
            echo "== downloading Godot ${version}"
            curl --fail --location --retry 3 --output "$RUNNER_TEMP/godot_${version}.zip" "$url"
            unzip -q "$RUNNER_TEMP/godot_${version}.zip" -d "$godot_dir"
            godot_bin="$godot_dir/$bin_name"
            chmod +x "$godot_bin" || true
            "$godot_bin" --version
            # Import once: a bare --script run on an unimported project never
            # registers .gdextension files, so the class would silently be
            # missing. Timeouts so a hang can never pass as success.
            run_guarded "$godot_bin" --headless --path demo --import 2>&1 | tail -5
            run_guarded "$godot_bin" --headless --path demo \
              --script res://tests/test_godot_scene.gd 2>&1 | tee "$RUNNER_TEMP/scene_${version}.log"
            echo "== modifier (scene-tree layer) assertions"
            run_guarded "$godot_bin" --headless --path demo \
              --script res://tests/test_modifier.gd 2>&1 | tee "$RUNNER_TEMP/modifier_${version}.log"
            echo "== humanoid demo assertions"
            run_guarded "$godot_bin" --headless --path demo \
              --script res://tests/test_humanoid.gd 2>&1 | tee "$RUNNER_TEMP/humanoid_${version}.log"
          done
      - name: Upload extension library
        uses: actions/upload-artifact@v4
        with:
          # v4 rejects a second upload under a name that already exists, and
          # several jobs now share an OS. The id keeps them distinct.
          name: fabrik-adapter-${{ matrix.id }}
          # demo/bin/ rather than build/bin/: it is the loadable bundle, with the
          # descriptor and any required runtime DLLs already beside the library.
          path: demo/bin/
          if-no-files-found: error
      - name: Save godot-cpp build cache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: .ccache
          key: ccache-${{ matrix.id }}-${{ env.GODOT_CPP_REF }}
      - name: Report ccache statistics
        if: always()
        shell: bash
        run: ccache --show-stats || true
      - name: Diff hygiene
        run: git diff --check
