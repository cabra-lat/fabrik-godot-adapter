name: adapter CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      FABRIK_CORE_REPOSITORY: cabra-lat/fabrik-fortran
      FABRIK_CORE_REF: a09dcc03ca74c35f9f090f4cf332e3ad7bd657f6
      # godot-cpp 4.4-stable ships no CMake install/export rules, so there is no
      # find_package() target to cache. ccache is the cache that works with the
      # add_subdirectory() flow, and the key is pinned to the godot-cpp commit.
      GODOT_CPP_REPOSITORY: godotengine/godot-cpp
      GODOT_CPP_REF: 714c9e2c165db2dcb7e6ea57e62a04204d3cfbfa
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 2G
    steps:
      - uses: actions/checkout@v4
      - name: Check out standalone core
        uses: actions/checkout@v4
        with:
          repository: cabra-lat/fabrik-fortran
          ref: a09dcc03ca74c35f9f090f4cf332e3ad7bd657f6
          path: core
      - uses: fortran-lang/setup-fortran@v1
        with:
          compiler: gcc
          version: ${{ runner.os == 'macOS' && '12' || 'latest' }}
      - uses: fortran-lang/setup-fpm@v10
        with:
          fpm-version: "v0.13.0"
      - name: Build and test core
        working-directory: core
        run: |
          fpm test --profile release
          fpm build --profile release
      - name: Assemble core install prefix
        run: python ci/collect_fpm_prefix.py --build core/build --prefix core-prefix
      - name: Check out pinned godot-cpp
        uses: actions/checkout@v4
        with:
          repository: godotengine/godot-cpp
          ref: 714c9e2c165db2dcb7e6ea57e62a04204d3cfbfa
          path: godot-cpp
      - name: Install ccache
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            choco install ccache -y --no-progress
            echo "/c/ProgramData/chocolatey/bin" >> "$GITHUB_PATH"
          elif [ "$RUNNER_OS" = "macOS" ]; then
            brew install ccache
          else
            sudo apt-get update
            sudo apt-get install -y ccache
          fi
      - name: Restore godot-cpp build cache
        id: ccache-restore
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-${{ matrix.os }}-Release-${{ env.GODOT_CPP_REF }}
      - name: Configure adapter
        shell: bash
        run: >
          cmake -S . -B build -G Ninja
          -DFABRIK_CORE_ROOT=core-prefix
          -DGODOT_CPP_SOURCE_DIR=godot-cpp
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_COMPILER=g++
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build adapter and C ABI smoke test
        shell: bash
        run: |
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure
      - name: Godot runtime check (4.4.1 and 4.7.1)
        shell: bash
        run: |
          set -euo pipefail
          echo "runner: $RUNNER_OS"
          case "$RUNNER_OS" in
            Linux)
              lib="libfabrik_adapter.so"
              url_441="https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip"
              url_471="https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip"
              bin_441="Godot_v4.4.1-stable_linux.x86_64"
              bin_471="Godot_v4.7.1-stable_linux.x86_64"
              ;;
            macOS)
              lib="libfabrik_adapter.dylib"
              url_441="https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_macos.universal.zip"
              url_471="https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_macos.universal.zip"
              bin_441="Godot.app/Contents/MacOS/Godot"
              bin_471="Godot.app/Contents/MacOS/Godot"
              ;;
            Windows)
              lib="fabrik_adapter.dll"
              url_441="https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_win64.exe.zip"
              url_471="https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_win64.exe.zip"
              bin_441="Godot_v4.4.1-stable_win64.exe"
              bin_471="Godot_v4.7.1-stable_win64.exe"
              ;;
          esac
          mkdir -p demo/bin
          cp "build/bin/$lib" "demo/bin/$lib"
          ls -l demo/bin
          for version in 441 471; do
            url_var="url_${version}"
            bin_var="bin_${version}"
            url="${!url_var}"
            bin_name="${!bin_var}"
            godot_dir="$RUNNER_TEMP/godot_${version}"
            rm -rf "$godot_dir"
            mkdir -p "$godot_dir"
            echo "== downloading Godot ${version}"
            curl --fail --location --retry 3 --output "$RUNNER_TEMP/godot_${version}.zip" "$url"
            unzip -q "$RUNNER_TEMP/godot_${version}.zip" -d "$godot_dir"
            godot_bin="$godot_dir/$bin_name"
            chmod +x "$godot_bin" || true
            "$godot_bin" --version
            # Import once: a bare --script run on an unimported project never
            # registers .gdextension files, so the class would silently be
            # missing. Timeouts so a hang can never pass as success.
            timeout 300 "$godot_bin" --headless --path demo --import 2>&1 | tail -5
            timeout 300 "$godot_bin" --headless --path demo \
              --script res://tests/test_godot_scene.gd 2>&1 | tee "$RUNNER_TEMP/scene_${version}.log"
          done
      - name: Upload extension library
        uses: actions/upload-artifact@v4
        with:
          name: fabrik-adapter-${{ matrix.os }}
          path: build/bin/
          if-no-files-found: error
      - name: Save godot-cpp build cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ccache-${{ matrix.os }}-Release-${{ env.GODOT_CPP_REF }}
      - name: Report ccache statistics
        if: always()
        shell: bash
        run: ccache --show-stats || true
      - name: Diff hygiene
        run: git diff --check
