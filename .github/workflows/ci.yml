name: adapter CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      FABRIK_CORE_REPOSITORY: cabra-lat/fabrik-fortran
      FABRIK_CORE_REF: f6c7404cff773172aefaa4b9cb189c854d9c6157
      # godot-cpp 4.4-stable ships no CMake install/export rules, so there is no
      # find_package() target to cache. ccache is the cache that works with the
      # add_subdirectory() flow, and the key is pinned to the godot-cpp commit.
      GODOT_CPP_REPOSITORY: godotengine/godot-cpp
      GODOT_CPP_REF: 714c9e2c165db2dcb7e6ea57e62a04204d3cfbfa
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 2G
    steps:
      - uses: actions/checkout@v4
      - name: Check out standalone core
        uses: actions/checkout@v4
        with:
          repository: cabra-lat/fabrik-fortran
          ref: f6c7404cff773172aefaa4b9cb189c854d9c6157
          path: core
      - uses: fortran-lang/setup-fortran@v1
        with:
          compiler: gcc
          version: ${{ runner.os == 'macOS' && '12' || 'latest' }}
      - uses: fortran-lang/setup-fpm@v10
        with:
          fpm-version: "v0.13.0"
      - name: Build and test core
        working-directory: core
        run: |
          fpm test --profile release
          fpm build --profile release
      - name: Assemble core install prefix
        run: python ci/collect_fpm_prefix.py --build core/build --prefix core-prefix
      - name: Check out pinned godot-cpp
        uses: actions/checkout@v4
        with:
          repository: godotengine/godot-cpp
          ref: 714c9e2c165db2dcb7e6ea57e62a04204d3cfbfa
          path: godot-cpp
      - name: Install ccache
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            choco install ccache -y --no-progress
            echo "/c/ProgramData/chocolatey/bin" >> "$GITHUB_PATH"
          elif [ "$RUNNER_OS" = "macOS" ]; then
            brew install ccache
          else
            sudo apt-get update
            sudo apt-get install -y ccache
          fi
      - name: Restore godot-cpp build cache
        id: ccache-restore
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-${{ matrix.os }}-Release-${{ env.GODOT_CPP_REF }}
      - name: Configure adapter
        shell: bash
        run: >
          cmake -S . -B build -G Ninja
          -DFABRIK_CORE_ROOT=core-prefix
          -DGODOT_CPP_SOURCE_DIR=godot-cpp
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_COMPILER=g++
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build adapter and C ABI smoke test
        shell: bash
        run: |
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure
      - name: Godot scene parse and instantiate
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/godot.zip" \
            https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          godot_bin=$(find "$RUNNER_TEMP/godot" -type f -name 'Godot_v4.4.1-stable_linux.x86_64' -print -quit)
          chmod +x "$godot_bin"
          mkdir -p bin
          cp build/bin/libfabrik_adapter.so bin/libfabrik_adapter.so
          "$godot_bin" --headless --path . --script res://tests/test_godot_scene.gd
      - name: Save godot-cpp build cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ccache-${{ matrix.os }}-Release-${{ env.GODOT_CPP_REF }}
      - name: Report ccache statistics
        if: always()
        shell: bash
        run: ccache --show-stats || true
      - name: Diff hygiene
        run: git diff --check
