name: export-ccache

# The adapter's CI already keeps a ccache directory per runner, but GitHub's
# cache API has no download endpoint outside the workflow that saved it, so a
# local build of godot-cpp starts cold every time. This job publishes the Linux
# cache as a workflow artifact, which `gh run download` CAN fetch - the point is
# to let a developer warm a local CCACHE_DIR once instead of rebuilding ~1000
# godot-cpp translation units by hand.
#
# Usage:
#   gh workflow run ccache-export.yml
#   gh run download --repo cabra-lat/fabrik-godot-adapter -n ccache-ubuntu
#   mkdir -p ~/.cache/ccache && tar -xf ccache-ubuntu.tar.gz -C ~/.cache/ccache
#   cmake -S . -B build -DCMAKE_CXX_COMPILER_LAUNCHER=ccache ...

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    name: export ubuntu ccache
    runs-on: ubuntu-latest
    env:
      # Must match the key the adapter CI saves, or the restore is a miss.
      GODOT_CPP_REF: 714c9e2c165db2dcb7e6ea57e62a04204d3cfbfa
    steps:
      - name: Restore the Linux ccache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-ubuntu-latest-Release-${{ env.GODOT_CPP_REF }}
      - name: Publish it as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: ccache-ubuntu
          path: .ccache
          retention-days: 30
          # .ccache is a dot-directory, and upload-artifact v4 skips hidden
          # paths unless told otherwise - without this the job succeeds having
          # published nothing at all.
          include-hidden-files: true
          # A missing cache is not a failure: it just means nobody has run the
          # adapter workflow on this ref yet, and there is nothing to export.
          if-no-files-found: warn
