version: 2
updates:
  # The core dependency and the godot-cpp pin are deliberate, reviewed pins.
  # Dependabot may propose bumps; a human decides, and flake.lock plus the CI
  # pin must be updated in the same commit.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # Batch patch and minor updates into one PR instead of one PR per action.
    # Majors stay ungrouped and arrive individually, because a major is the case
    # that actually needs a human: upload-artifact v5 made artifacts immutable,
    # and that would not have been obvious from the diff.
    groups:
      github-actions-patch-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: monthly
    # godot-cpp is checked out by commit, not by module version.
    open-pull-requests-limit: 0
